name: Urus CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel previous runs of this workflow on the same branch when a new
# commit is pushed — saves CI minutes during rapid iteration on a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-compiler matrix on Linux. We test both gcc and clang on each
  # PR — they catch slightly different classes of bugs (clang's static
  # analyzer is stricter; gcc's link-time error messages are clearer)
  # and we want to know about both before merge.
  build-and-test:
    name: build (${{ matrix.cc }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        cc: [gcc, clang]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential ${{ matrix.cc }}

    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
      run: cmake -S compiler -B compiler/build -DCMAKE_BUILD_TYPE=Release

    - name: Build Urus Compiler
      run: cmake --build compiler/build --parallel $(nproc)

    - name: Install stdlib
      run: |
        sudo mkdir -p /usr/lib/urusc
        sudo cp compiler/stdlib/*.urus /usr/lib/urusc/

    - name: Smoke test (--version)
      # Sanity check that the binary actually starts and reports the
      # version we expect before we run the larger CTest suite.
      run: |
        ./compiler/build/urusc --version

    - name: Run CTest
      run: ctest --test-dir compiler/build --output-on-failure --parallel $(nproc)

    - name: Run determinism fixtures explicitly
      # The determinism_* CTest entries (registered in compiler/CMakeLists.txt
      # via tests/determinism.cmake, see PR #201) are already part of the
      # main ctest run above. We re-run just that subset with verbose
      # output so a future regression shows up as a focused diff in the
      # CI log instead of buried in 30+ run-test outputs.
      run: ctest --test-dir compiler/build -R '^determinism_' --output-on-failure --verbose

  sanitizers:
    # Build the compiler under AddressSanitizer + UndefinedBehaviorSanitizer
    # and run the test suite through it. Catches use-after-free, out-of-
    # bounds, leaks, signed overflow, NULL deref, and other UB that a
    # plain release build silently accepts.
    #
    # We don't gate the main 'build-and-test' job on this — sanitizers
    # can have false positives in third-party code (e.g. emcc/stdlib),
    # and the foundation work specifically targets the compiler binary,
    # not the user runtime. Treat failures here as bugs in our code.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential clang

    - name: Configure CMake (sanitizer=${{ matrix.sanitizer }})
      env:
        CC: clang
        # -fno-omit-frame-pointer keeps ASan/UBSan stack traces readable.
        # -fno-sanitize-recover=all turns UBSan warnings into hard errors
        # so the test fails the job instead of silently continuing.
        CFLAGS: -fsanitize=${{ matrix.sanitizer }} -fno-sanitize-recover=all -fno-omit-frame-pointer -g -O1
        LDFLAGS: -fsanitize=${{ matrix.sanitizer }}
      run: cmake -S compiler -B compiler/build -DCMAKE_BUILD_TYPE=Debug

    - name: Build Urus Compiler
      run: cmake --build compiler/build --parallel $(nproc)

    - name: Install stdlib
      run: |
        sudo mkdir -p /usr/lib/urusc
        sudo cp compiler/stdlib/*.urus /usr/lib/urusc/

    - name: Run CTest under ${{ matrix.sanitizer }}sanitizer
      env:
        # detect_leaks=0 — the compiler currently uses arena-style
        # allocation and exits without explicitly freeing the AST,
        # scope chain, or symbol tables. Every successful invocation
        # therefore "leaks" by LeakSanitizer's reckoning, which would
        # turn the entire run_* test suite red without telling us
        # anything actionable. The real value of this matrix is
        # catching use-after-free, heap-buffer-overflow, signed
        # overflow, and other use-while-running UB — all still on.
        # Plugging the at-exit leaks is tracked as a follow-up
        # (would require running the destructor chain that today only
        # runs implicitly via process exit).
        ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:abort_on_error=1
      run: ctest --test-dir compiler/build --output-on-failure --parallel $(nproc)
